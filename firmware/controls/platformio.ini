; DIY flight controls (stick + throttle + pedals) as ONE USB joystick.
; Arduino Pro Micro 5 V 16 MHz (ATmega32U4) + TCA9548A I2C mux + 6x AS5600 + 2x PCF8574 (buttons / hats)
; Build:  python -m platformio run -d firmware/controls
; Upload: python -m platformio run -d firmware/controls -t upload --upload-port COM7
;         (if the port vanishes: short RST to GND twice quickly, then upload within 8 s)
[env:promicro]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/MHeironimus/ArduinoJoystickLibrary.git#v2.1.1
build_flags = -Wall
