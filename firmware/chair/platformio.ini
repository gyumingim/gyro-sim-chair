; Chair controller: ESP32 DevKitC (ESP32-WROOM-32) + Cytron MDD10A + LSM6DSOX IMU + 2x AS5600 (weight position)
; Build:  python -m platformio run -d firmware/chair
; Upload: python -m platformio run -d firmware/chair -t upload --upload-port COM5
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
